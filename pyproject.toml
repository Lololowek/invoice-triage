[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invoice-triage"
version = "0.1.0"
description = "Invoice field extraction that decides which fields a human must check"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pdfplumber>=0.11",
    "rapidfuzz>=3.6",
    "python-dateutil>=2.9",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "reportlab>=4.1"]

[project.scripts]
triage = "triage.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Cyrillic and typographic characters are intentional

[tool.ruff.lint.per-file-ignores]
"synth/specs.py" = ["E501"]  # literal invoice data reads better unwrapped
"synth/layouts.py" = ["E501"]  # flowable lists are kept one row per visual block

[tool.pytest.ini_options]
testpaths = ["tests"]
