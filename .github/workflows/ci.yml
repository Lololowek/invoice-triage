name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests synth
      - run: ruff format --check src tests synth

  test:
    # Windows too: the author develops on Windows (encodings, paths, .env loading).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      # The model is mocked or replaced by the gold-annotation oracle: no network, no GPU.
      - run: pytest -q
      # Offline end to end on all 15 invoices. The quoted wildcard is expanded by the CLI itself,
      # as it must be on Windows, where the shell does not do it.
      - run: triage eval "data/invoices/*.pdf" --oracle
